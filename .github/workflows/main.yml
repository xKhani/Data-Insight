name: Data-Insight Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  evaluate-agent:
    runs-on: ubuntu-latest

    env:
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_PROJECT: "Data-Insight-CI"
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI quality gate (Deterministic)
        run: |
          python run_eval.py \
            --dataset test_dataset.json \
            --thresholds eval_thresholds.json \
            --results ci_eval_results.json \
            --summary ci_eval_summary.json \
            --gate-output quality_gate_results.json

      - name: Run DeepEval (AI Judge via Groq)
        run: |
          python evaluation/test_deepeval_ci.py

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-results
          path: |
            ci_eval_results.json
            ci_eval_summary.json
            quality_gate_results.json
            ci_deepeval_report.json

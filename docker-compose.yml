version: '3.8'

services:
  api:
    build: .
    container_name: data-insight-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    # This allows the container to access Ollama running on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
